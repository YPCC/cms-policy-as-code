[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-policy-as-code"
version = "0.1.0"
description = "Enterprise Policy-as-Code / Context Graph Engine for CMS reimbursement compliance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
